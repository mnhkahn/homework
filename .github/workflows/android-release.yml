name: Android Release Build

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy SDK "tools" package was retired by Google. The command-line
          # tools are installed by the action; this is the only extra SDK package
          # needed before Gradle provisions the project-specific platform/build tools.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # This is deliberately used only once. Existing tablets were initially
      # installed with the Android debug certificate, while normal releases use
      # the release certificate. Android 13+ accepts the v3.1 signing lineage
      # and preserves the Device Owner's app data during this transition.
      - name: Decode debug keystore for signing migration
        if: github.ref_name == '0.1.5'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        env:
          HOMEWORK_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          HOMEWORK_RELEASE_STORE_PASSWORD: ${{ secrets.HOMEWORK_RELEASE_STORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
          -PreleaseVersionName="${GITHUB_REF_NAME#v}" \
          -PreleaseVersionCode="${{ github.run_number }}"

      - name: Rename APKs
        env:
          HOMEWORK_RELEASE_STORE_PASSWORD: ${{ secrets.HOMEWORK_RELEASE_STORE_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/HomeworkBuddy-${VERSION}-debug.apk"
          if [ "$GITHUB_REF_NAME" = "0.1.5" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
            "$APKSIGNER" rotate --out "$RUNNER_TEMP/signing-lineage.bin" \
              --old-signer --ks "$RUNNER_TEMP/debug.keystore" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android --set-installed-data true \
              --new-signer --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias homeworkbuddy \
              --ks-pass env:HOMEWORK_RELEASE_STORE_PASSWORD --key-pass env:HOMEWORK_RELEASE_STORE_PASSWORD
            "$APKSIGNER" sign --out "artifacts/HomeworkBuddy-release.apk" \
              --lineage "$RUNNER_TEMP/signing-lineage.bin" \
              --ks "$RUNNER_TEMP/debug.keystore" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --next-signer --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias homeworkbuddy \
              --ks-pass env:HOMEWORK_RELEASE_STORE_PASSWORD --key-pass env:HOMEWORK_RELEASE_STORE_PASSWORD \
              app/build/outputs/apk/release/app-release.apk
            "$APKSIGNER" verify --verbose --print-certs "artifacts/HomeworkBuddy-release.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk "artifacts/HomeworkBuddy-release.apk"
          fi
          ls -lh artifacts/

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.ref_name }}
          path: artifacts/*.apk
          if-no-files-found: error

      # 蒲公英使用新版「获取凭证 → 上传 → 查询发布结果」接口；上传成功
      # 只表示文件已传到存储，必须等到 buildInfo 返回成功才算真正可下载。
      - name: Publish release APK to Pgyer
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$PGYER_API_KEY" ]; then
            echo "::error::PGYER_API_KEY secret is not set"
            exit 1
          fi

          APK_PATH="artifacts/HomeworkBuddy-release.apk"
          UPDATE_DESCRIPTION="Homework Buddy ${VERSION:-manual}"
          TOKEN_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --form "_api_key=${PGYER_API_KEY}" \
            --form "buildType=android" \
            --form "buildInstallType=1" \
            --form "buildInstallDate=2" \
            --form "buildUpdateDescription=${UPDATE_DESCRIPTION}" \
            https://www.pgyer.com/apiv2/app/getCOSToken)
          if [ "$(jq -r '.code' <<<"$TOKEN_RESPONSE")" != "0" ]; then
            echo "::error::Pgyer did not issue an upload token: $(jq -r '.message // "unknown error"' <<<"$TOKEN_RESPONSE")"
            exit 1
          fi

          UPLOAD_ENDPOINT=$(jq -r '.data.endpoint' <<<"$TOKEN_RESPONSE")
          BUILD_KEY=$(jq -r '.data.key' <<<"$TOKEN_RESPONSE")
          UPLOAD_KEY=$(jq -r '.data.params.key' <<<"$TOKEN_RESPONSE")
          SIGNATURE=$(jq -r '.data.params.signature' <<<"$TOKEN_RESPONSE")
          SECURITY_TOKEN=$(jq -r '.data.params["x-cos-security-token"]' <<<"$TOKEN_RESPONSE")
          curl --fail-with-body --silent --show-error \
            --form-string "key=${UPLOAD_KEY}" \
            --form-string "signature=${SIGNATURE}" \
            --form-string "x-cos-security-token=${SECURITY_TOKEN}" \
            --form-string "x-cos-meta-file-name=HomeworkBuddy-release.apk" \
            --form "file=@${APK_PATH}" \
            "$UPLOAD_ENDPOINT"

          # Pgyer documents 1246/1247 as processing states.  Other non-zero
          # codes are terminal failures and must fail the release job.
          for attempt in $(seq 1 60); do
            BUILD_RESPONSE=$(curl --fail-with-body --silent --show-error --get \
              --data-urlencode "_api_key=${PGYER_API_KEY}" \
              --data-urlencode "buildKey=${BUILD_KEY}" \
              https://www.pgyer.com/apiv2/app/buildInfo)
            BUILD_CODE=$(jq -r '.code' <<<"$BUILD_RESPONSE")
            if [ "$BUILD_CODE" = "0" ]; then
              SHORT_URL=$(jq -r '.data.buildShortcutUrl' <<<"$BUILD_RESPONSE")
              PGYER_RELEASE_URL="https://www.pgyer.com/${SHORT_URL}"
              echo "PGYER_RELEASE_URL=${PGYER_RELEASE_URL}" >> "$GITHUB_ENV"
              echo "Pgyer release: ${PGYER_RELEASE_URL}"
              exit 0
            fi
            if [ "$BUILD_CODE" != "1246" ] && [ "$BUILD_CODE" != "1247" ]; then
              echo "::error::Pgyer publish failed (${BUILD_CODE}): $(jq -r '.message // "unknown error"' <<<"$BUILD_RESPONSE")"
              exit 1
            fi
            echo "Pgyer is publishing (attempt ${attempt}/60)"
            sleep 3
          done

          echo "::error::Timed out waiting for Pgyer to publish the APK"
          exit 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # 固定文件名，App 内自动升级按资产名匹配下载。
          files: artifacts/HomeworkBuddy-release.apk

      - name: Notify Feishu
        if: always()
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PGYER_RELEASE_URL: ${{ env.PGYER_RELEASE_URL }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL not set, skip"
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            RELEASE_URL="https://github.com/${REPO}/releases/tag/${REF_NAME}"
            TEXT=$(printf '%s %s 构建成功 %s\n蒲公英: %s\nRelease: %s\nRun: %s' "$ICON" "$REPO" "$REF_NAME" "$PGYER_RELEASE_URL" "$RELEASE_URL" "$RUN_URL")
          else
            ICON="❌"
            TEXT=$(printf '%s %s 构建失败 %s\nRun: %s' "$ICON" "$REPO" "$REF_NAME" "$RUN_URL")
          fi
          PAYLOAD=$(jq -cn --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}')
          curl -sf -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" && echo "feishu notified" || echo "feishu notify failed"
