name: Android Release Build

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy SDK "tools" package was retired by Google. The command-line
          # tools are installed by the action; this is the only extra SDK package
          # needed before Gradle provisions the project-specific platform/build tools.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        env:
          HOMEWORK_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          HOMEWORK_RELEASE_STORE_PASSWORD: ${{ secrets.HOMEWORK_RELEASE_STORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace \
          -PreleaseVersionName="${GITHUB_REF_NAME#v}" \
          -PreleaseVersionCode="${{ github.run_number }}"

      - name: Rename APKs
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/HomeworkBuddy-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "artifacts/HomeworkBuddy-release.apk"
          ls -lh artifacts/

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.ref_name }}
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # 固定文件名，App 内自动升级按资产名匹配下载。
          files: artifacts/HomeworkBuddy-release.apk

      - name: Notify Feishu
        if: always()
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL not set, skip"
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            RELEASE_URL="https://github.com/${REPO}/releases/tag/${REF_NAME}"
            TEXT=$(printf '%s %s 构建成功 %s\nRelease: %s\nRun: %s' "$ICON" "$REPO" "$REF_NAME" "$RELEASE_URL" "$RUN_URL")
          else
            ICON="❌"
            TEXT=$(printf '%s %s 构建失败 %s\nRun: %s' "$ICON" "$REPO" "$REF_NAME" "$RUN_URL")
          fi
          PAYLOAD=$(jq -cn --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}')
          curl -sf -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" && echo "feishu notified" || echo "feishu notify failed"
